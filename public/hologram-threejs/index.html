<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Holo-Deck — 3D Interactive Holographic Card</title>
<meta name="description" content="A single-file three.js holographic display card: render-target volumetric projection, custom hologram shader, presets and your own GLB models." />
<meta property="og:title" content="Holo-Deck — 3D Interactive Holographic Card" />
<meta property="og:description" content="Render-target volumetric hologram projection in three.js, with presets and custom GLB upload." />
<meta property="og:type" content="website" />
<meta name="twitter:card" content="summary_large_image" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Rajdhani:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #05070d;
    --panel: rgba(10, 18, 28, 0.62);
    --line: rgba(120, 220, 255, 0.16);
    --accent: #38e8ff;
    --text: #d8ecf6;
    --muted: #6f8496;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text);
    font-family: Rajdhani, ui-sans-serif, system-ui, sans-serif; overflow: hidden; }
  #stage { position: fixed; inset: 0; }
  canvas { display: block; touch-action: none; }

  .hud { position: fixed; z-index: 10; }

  .glass {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 16px;
    backdrop-filter: blur(18px) saturate(140%);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
    box-shadow: 0 20px 60px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.06);
  }

  #brand { top: 20px; left: 20px; padding: 12px 18px; display: flex; align-items: center; gap: 16px; }
  #gh-link { color: var(--muted); display: inline-flex; transition: color .2s, filter .2s; }
  #gh-link:hover { color: var(--accent); filter: drop-shadow(0 0 6px var(--accent)); }
  #brand h1 { margin: 0; font-family: Orbitron, sans-serif; font-size: 15px; letter-spacing: .28em;
    color: var(--accent); text-shadow: 0 0 18px rgba(56,232,255,.45); }
  #brand p { margin: 4px 0 0; font-size: 12px; letter-spacing: .22em; color: var(--muted); text-transform: uppercase; }

  #panel { top: 20px; right: 20px; width: 320px; max-height: calc(100dvh - 40px);
    overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 16px; }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(120,220,255,.25); border-radius: 99px; }

  .section > .label { font-family: Orbitron, sans-serif; font-size: 10px; letter-spacing: .24em;
    color: var(--muted); text-transform: uppercase; margin-bottom: 8px; display: block; }

  .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px;
    background: rgba(255,255,255,.04); padding: 4px; border-radius: 10px; }
  .tabs button { all: unset; text-align: center; padding: 7px 0; border-radius: 7px; cursor: pointer;
    font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .tabs button[aria-selected="true"] { background: rgba(56,232,255,.14); color: var(--accent);
    box-shadow: inset 0 0 0 1px rgba(56,232,255,.3); }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { all: unset; cursor: pointer; padding: 7px 11px; border-radius: 8px; font-size: 12px;
    letter-spacing: .08em; color: var(--muted); border: 1px solid var(--line); }
  .chip[aria-pressed="true"] { color: #04121c; background: var(--accent); border-color: transparent;
    box-shadow: 0 0 20px rgba(56,232,255,.35); font-weight: 600; }
  .chip .dot { display: inline-block; width: 8px; height: 8px; border-radius: 99px; margin-right: 7px;
    vertical-align: middle; }

  .drop { border: 1px dashed rgba(120,220,255,.32); border-radius: 12px; padding: 18px 12px;
    text-align: center; cursor: pointer; font-size: 13px; color: var(--muted); transition: .18s; }
  .drop:hover, .drop.over { border-color: var(--accent); color: var(--accent); background: rgba(56,232,255,.06); }
  .status { font-size: 12px; margin-top: 8px; min-height: 16px; word-break: break-all; }
  .status.err { color: #ff6b8a; }
  .status.ok { color: #4dff88; }

  .row { display: flex; align-items: center; justify-content: space-between; font-size: 12px;
    letter-spacing: .08em; color: var(--muted); text-transform: uppercase; margin-bottom: 6px; }
  .row span:last-child { color: var(--accent); font-variant-numeric: tabular-nums; }
  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 3px;
    background: rgba(255,255,255,.12); border-radius: 99px; outline: none; margin: 0 0 14px; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px;
    border-radius: 99px; background: var(--accent); box-shadow: 0 0 12px rgba(56,232,255,.7); cursor: pointer; }
  input[type=range]::-moz-range-thumb { width: 14px; height: 14px; border: 0; border-radius: 99px;
    background: var(--accent); cursor: pointer; }

  .toggles { display: grid; gap: 6px; }
  .toggle { display: flex; align-items: center; justify-content: space-between; cursor: pointer;
    padding: 8px 10px; border-radius: 9px; border: 1px solid var(--line); font-size: 12px;
    letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .toggle[aria-pressed="true"] { color: var(--accent); border-color: rgba(56,232,255,.4);
    background: rgba(56,232,255,.07); }
  .pill { width: 30px; height: 16px; border-radius: 99px; background: rgba(255,255,255,.12); position: relative; }
  .toggle[aria-pressed="true"] .pill { background: rgba(56,232,255,.5); }
  .pill::after { content: ''; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px;
    border-radius: 99px; background: #d8ecf6; transition: .18s; }
  .toggle[aria-pressed="true"] .pill::after { left: 16px; background: #04121c; }

  #dock { bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; padding: 8px; }
  #dock button { all: unset; cursor: pointer; display: flex; align-items: center; gap: 8px;
    padding: 9px 14px; border-radius: 10px; font-size: 12px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--muted); border: 1px solid transparent; }
  #dock button:hover { color: var(--text); background: rgba(255,255,255,.05); }
  #dock button[aria-pressed="true"] { color: var(--accent); border-color: rgba(56,232,255,.35);
    background: rgba(56,232,255,.08); }
  #dock svg { width: 15px; height: 15px; }

  #help { position: fixed; bottom: 22px; left: 20px; font-size: 12px; letter-spacing: .12em;
    color: var(--muted); text-transform: uppercase; z-index: 10; }
  #help a { color: var(--accent); text-decoration: none; }

  @media (max-width: 820px) {
    #panel { top: auto; bottom: 84px; right: 12px; left: 12px; width: auto; max-height: 42dvh; }
    #brand { padding: 9px 14px; }
    #help { display: none; }
  }
</style>
</head>
<body>
<div id="stage"></div>

<header class="hud glass" id="brand">
  <div>
    <h1>HOLO-DECK</h1>
    <p>Volumetric Projection Unit MK-VII</p>
  </div>
  <a id="gh-link" href="https://github.com/saurabhgayali/hologram-studio" target="_blank" rel="noopener" title="View source on GitHub" aria-label="GitHub repository">
    <svg viewBox="0 0 16 16" width="20" height="20" fill="currentColor" aria-hidden="true">
      <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/>
    </svg>
  </a>
</header>

<aside class="hud glass" id="panel">
  <div class="section">
    <span class="label">Model Source</span>
    <div class="tabs" id="tabs">
      <button data-tab="preset" aria-selected="true">Presets</button>
      <button data-tab="custom" aria-selected="false">Upload GLB</button>
    </div>
  </div>

  <div class="section" id="preset-section">
    <span class="label">Preset Scene</span>
    <div class="chips" id="presets"></div>
  </div>

  <div class="section" id="custom-section" hidden>
    <span class="label">Custom Model</span>
    <div class="drop" id="drop">Drop a <b>.glb</b> / <b>.gltf</b> here<br />or click to browse</div>
    <input type="file" id="file" accept=".glb,.gltf,model/gltf-binary,model/gltf+json" hidden />
    <div class="status" id="status"></div>
  </div>

  <div class="section">
    <span class="label">Hologram Tint</span>
    <div class="chips" id="tints"></div>
  </div>

  <div class="section">
    <span class="label">FX Controls</span>
    <div class="row"><span>Scanline Speed</span><span id="v-scan">1.00</span></div>
    <input type="range" id="s-scan" min="0" max="4" step="0.05" value="1" />
    <div class="row"><span>Transparency</span><span id="v-op">0.90</span></div>
    <input type="range" id="s-op" min="0.1" max="1" step="0.01" value="0.9" />
    <div class="row"><span>Glitch Intensity</span><span id="v-gl">0.15</span></div>
    <input type="range" id="s-gl" min="0" max="1" step="0.01" value="0.15" />
    <div class="row"><span>Light Intensity</span><span id="v-li">1.40</span></div>
    <input type="range" id="s-li" min="0" max="3" step="0.05" value="1.4" />
  </div>

  <div class="section">
    <span class="label">Background FX</span>
    <div class="toggles">
      <button class="toggle" data-fx="starfield" aria-pressed="true">Starfield <i class="pill"></i></button>
      <button class="toggle" data-fx="fire" aria-pressed="false">Embers <i class="pill"></i></button>
      <button class="toggle" data-fx="fog" aria-pressed="true">Volumetric Fog <i class="pill"></i></button>
    </div>
  </div>
</aside>

<nav class="hud glass" id="dock">
  <button id="btn-rotate" aria-pressed="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg>
    Auto-Rotate
  </button>
  <button id="btn-reset">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9"/><path d="M3 3v6h6"/></svg>
    Reset View
  </button>
  <button id="btn-full">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M16 3h3a2 2 0 0 1 2 2v3"/><path d="M8 21H5a2 2 0 0 1-2-2v-3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
    Fullscreen
  </button>
</nav>

<div id="help">Drag to orbit · Scroll to zoom · <a href="./doc.html">Docs</a> · <a href="https://github.com/saurabhgayali/hologram-studio" target="_blank" rel="noopener">GitHub</a></div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.180.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.180.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { HoloProjector, createValidatedModelURL } from './holo-projector.js';
import { PRESETS, TINTS, createStarfield, createEmbers } from './presets.js';

/* --------------------------------- state --------------------------------- */

const state = {
  source: 'preset',
  preset: 'crystal',
  tint: 'cyan',
  scanSpeed: 1,
  opacity: 0.9,
  glitch: 0.15,
  light: 1.4,
  fog: true,
  starfield: true,
  fire: false,
  autoRotate: false,
};

/* -------------------------------- renderer -------------------------------- */

const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.outputColorSpace = THREE.SRGBColorSpace;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color('#05070d');
scene.fog = new THREE.FogExp2('#05070d', 0.045);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 200);
camera.position.set(0, 0.4, 7.5);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 4;
controls.maxDistance = 14;
controls.target.set(0, 0.2, 0);
controls.saveState();

// soft studio reflections for the metallic card frame
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

scene.add(new THREE.AmbientLight(0xffffff, 0.25));
const keyLight = new THREE.DirectionalLight(0xffffff, 1.1);
keyLight.position.set(4, 6, 5);
scene.add(keyLight);
const rimLight = new THREE.SpotLight(0x3aa8ff, 40, 0, 0.5, 1);
rimLight.position.set(-6, 4, 4);
scene.add(rimLight);

/* ------------------------------- the card -------------------------------- */

function roundedBoxGeometry(w, h, d, r) {
  const shape = new THREE.Shape();
  const x = -w / 2, y = -h / 2;
  shape.moveTo(x + r, y);
  shape.lineTo(x + w - r, y);
  shape.quadraticCurveTo(x + w, y, x + w, y + r);
  shape.lineTo(x + w, y + h - r);
  shape.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  shape.lineTo(x + r, y + h);
  shape.quadraticCurveTo(x, y + h, x, y + h - r);
  shape.lineTo(x, y + r);
  shape.quadraticCurveTo(x, y, x + r, y);
  const geo = new THREE.ExtrudeGeometry(shape, {
    depth: d * 0.7, bevelEnabled: true, bevelThickness: d * 0.15,
    bevelSize: d * 0.15, bevelSegments: 4, curveSegments: 12,
  });
  geo.center();
  return geo;
}

const card = new THREE.Group();
scene.add(card);

const frame = new THREE.Mesh(
  roundedBoxGeometry(3.2, 4.5, 0.18, 0.14),
  new THREE.MeshPhysicalMaterial({
    color: '#0a0f17', metalness: 0.92, roughness: 0.22,
    clearcoat: 1, clearcoatRoughness: 0.12, envMapIntensity: 1.1,
  }),
);
card.add(frame);

const recess = new THREE.Mesh(
  new THREE.PlaneGeometry(2.72, 3.4),
  new THREE.MeshPhysicalMaterial({ color: '#04070c', metalness: 0.6, roughness: 0.5 }),
);
recess.position.set(0, 0.22, 0.095);
card.add(recess);

/* ----------------------- the reusable holo projector ---------------------- */

const holo = new HoloProjector({ renderer, size: 1024, tint: TINTS[state.tint].hex });

const panelMesh = new THREE.Mesh(new THREE.PlaneGeometry(2.66, 3.34), holo.material);
panelMesh.position.set(0, 0.22, 0.11);
card.add(panelMesh);
holo.attachTo(panelMesh);

const glass = new THREE.Mesh(
  new THREE.PlaneGeometry(2.72, 3.4),
  new THREE.MeshPhysicalMaterial({
    transparent: true, opacity: 0.06, roughness: 0.05, metalness: 0,
    depthWrite: false, color: '#9fe9ff',
  }),
);
glass.position.set(0, 0.22, 0.135);
card.add(glass);

const accentBar = new THREE.Mesh(
  new THREE.PlaneGeometry(1.1, 0.03),
  new THREE.MeshBasicMaterial({ color: TINTS[state.tint].hex, toneMapped: false }),
);
accentBar.position.set(0, 2.02, 0.1);
card.add(accentBar);

const emitGlow = new THREE.PointLight(new THREE.Color(TINTS[state.tint].hex), 2.4, 5);
emitGlow.position.set(0, 0.22, 0.9);
card.add(emitGlow);

/* engraved labels drawn on a canvas texture */
function labelTexture(main, sub, hex) {
  const c = document.createElement('canvas');
  c.width = 1024; c.height = 192;
  const g = c.getContext('2d');
  g.clearRect(0, 0, c.width, c.height);
  g.textAlign = 'center';
  g.fillStyle = hex;
  g.shadowColor = hex; g.shadowBlur = 22;
  g.font = '600 58px Orbitron, sans-serif';
  g.fillText(main, 512, 66);
  g.shadowBlur = 0;
  g.fillStyle = '#6f8496';
  g.font = '500 30px Rajdhani, sans-serif';
  g.fillText(sub, 512, 126);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return tex;
}
let labelMat = new THREE.MeshBasicMaterial({ transparent: true, toneMapped: false });
const label = new THREE.Mesh(new THREE.PlaneGeometry(2.4, 0.45), labelMat);
label.position.set(0, -1.95, 0.1);
card.add(label);
function refreshLabel() {
  if (labelMat.map) labelMat.map.dispose();
  labelMat.map = labelTexture('H O L O - D E C K   M K - V I I', 'VOLUMETRIC PROJECTION UNIT', TINTS[state.tint].hex);
  labelMat.needsUpdate = true;
}
document.fonts.ready.then(refreshLabel);
refreshLabel();

/* --------------------------- hologram scene wiring ------------------------ */

let activePreset = null;
let bgFx = { starfield: null, embers: null };
let customURL = null;

function setPreset(id) {
  if (activePreset) { holo.contentGroup.remove(activePreset.object); activePreset.dispose(); activePreset = null; }
  holo.clearContent();
  const factory = PRESETS[id];
  if (!factory) return;
  activePreset = factory.create({ color: TINTS[state.tint].hex });
  holo.setContent(activePreset.object, { fit: false });
}

async function setCustomModel(url) {
  if (activePreset) { holo.contentGroup.remove(activePreset.object); activePreset.dispose(); activePreset = null; }
  await holo.loadGLB(url); // auto-centered + auto-scaled into the hidden frustum
}

function syncBackgroundFx() {
  if (state.starfield && !bgFx.starfield) { bgFx.starfield = createStarfield(); holo.scene.add(bgFx.starfield.object); }
  if (!state.starfield && bgFx.starfield) { holo.scene.remove(bgFx.starfield.object); bgFx.starfield.dispose(); bgFx.starfield = null; }
  if (state.fire && !bgFx.embers) { bgFx.embers = createEmbers(); holo.scene.add(bgFx.embers.object); }
  if (!state.fire && bgFx.embers) { holo.scene.remove(bgFx.embers.object); bgFx.embers.dispose(); bgFx.embers = null; }
  holo.scene.fog = state.fog ? new THREE.FogExp2('#04121c', 0.03) : null;
}

setPreset(state.preset);
syncBackgroundFx();
holo.setLightIntensity(state.light);

/* ----------------------------------- UI ----------------------------------- */

const $ = (id) => document.getElementById(id);

// preset chips
const presetsEl = $('presets');
for (const [id, p] of Object.entries(PRESETS)) {
  const b = document.createElement('button');
  b.className = 'chip';
  b.textContent = p.label;
  b.setAttribute('aria-pressed', String(id === state.preset));
  b.onclick = () => {
    state.preset = id; state.source = 'preset';
    setPreset(id);
    [...presetsEl.children].forEach((c) => c.setAttribute('aria-pressed', String(c === b)));
    selectTab('preset');
  };
  presetsEl.appendChild(b);
}

// tint chips
const tintsEl = $('tints');
for (const [id, t] of Object.entries(TINTS)) {
  const b = document.createElement('button');
  b.className = 'chip';
  b.innerHTML = `<i class="dot" style="background:${t.hex}"></i>${t.label}`;
  b.setAttribute('aria-pressed', String(id === state.tint));
  b.onclick = () => {
    state.tint = id;
    const hex = t.hex;
    document.documentElement.style.setProperty('--accent', hex);
    holo.setTint(hex);
    accentBar.material.color.set(hex);
    emitGlow.color.set(hex);
    refreshLabel();
    if (state.source === 'preset') setPreset(state.preset);
    [...tintsEl.children].forEach((c) => c.setAttribute('aria-pressed', String(c === b)));
  };
  tintsEl.appendChild(b);
}

// tabs
function selectTab(tab) {
  state.source = tab;
  [...$('tabs').children].forEach((b) => b.setAttribute('aria-selected', String(b.dataset.tab === tab)));
  $('preset-section').hidden = tab !== 'preset';
  $('custom-section').hidden = tab !== 'custom';
  if (tab === 'preset') setPreset(state.preset);
  else if (customURL) setCustomModel(customURL).catch(showLoadError);
}
[...$('tabs').children].forEach((b) => (b.onclick = () => selectTab(b.dataset.tab)));

// sliders
function slider(inputId, valueId, key, apply) {
  const input = $(inputId), out = $(valueId);
  input.oninput = () => {
    const v = parseFloat(input.value);
    state[key] = v;
    out.textContent = v.toFixed(2);
    apply(v);
  };
}
slider('s-scan', 'v-scan', 'scanSpeed', (v) => holo.setScanSpeed(v));
slider('s-op', 'v-op', 'opacity', (v) => holo.setOpacity(v));
slider('s-gl', 'v-gl', 'glitch', (v) => holo.setGlitch(v));
slider('s-li', 'v-li', 'light', (v) => holo.setLightIntensity(v));

// background fx toggles
document.querySelectorAll('.toggle').forEach((btn) => {
  btn.onclick = () => {
    const key = btn.dataset.fx;
    state[key] = !state[key];
    btn.setAttribute('aria-pressed', String(state[key]));
    syncBackgroundFx();
  };
});

// dock
$('btn-rotate').onclick = () => {
  state.autoRotate = !state.autoRotate;
  holo.setAutoRotate(state.autoRotate);
  $('btn-rotate').setAttribute('aria-pressed', String(state.autoRotate));
};
$('btn-reset').onclick = () => { controls.reset(); card.rotation.set(0, 0, 0); };
$('btn-full').onclick = () => {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen?.();
};

/* ------------------------------ GLB uploading ----------------------------- */

const drop = $('drop'), fileInput = $('file'), status = $('status');

function setStatus(msg, kind = '') { status.textContent = msg; status.className = 'status ' + kind; }
function showLoadError(err) { setStatus('Could not load model: ' + (err?.message || err), 'err'); }

async function handleFile(file) {
  if (!file) return;
  setStatus('Validating ' + file.name + '…');
  const res = await createValidatedModelURL(file);
  if (!res.ok) { setStatus(res.error, 'err'); return; }
  setStatus('Loading ' + file.name + '…');
  try {
    if (customURL) URL.revokeObjectURL(customURL);
    customURL = res.url;
    selectTab('custom');
    await setCustomModel(customURL);
    setStatus('Projecting ' + file.name, 'ok');
  } catch (err) {
    showLoadError(err);
    res.revoke();
    customURL = null;
  }
}

drop.onclick = () => fileInput.click();
fileInput.onchange = () => handleFile(fileInput.files[0]);
['dragenter', 'dragover'].forEach((e) => drop.addEventListener(e, (ev) => { ev.preventDefault(); drop.classList.add('over'); }));
['dragleave', 'drop'].forEach((e) => drop.addEventListener(e, (ev) => { ev.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', (ev) => handleFile(ev.dataTransfer?.files?.[0]));
window.addEventListener('dragover', (e) => e.preventDefault());
window.addEventListener('drop', (e) => e.preventDefault());

/* -------------------------------- run loop -------------------------------- */

const clock = new THREE.Clock();

function frameLoop() {
  const delta = Math.min(clock.getDelta(), 0.05);
  const elapsed = clock.elapsedTime;

  if (activePreset) activePreset.update(delta, elapsed, { autoRotate: state.autoRotate });
  if (bgFx.embers) bgFx.embers.update(delta, elapsed);

  controls.update();
  holo.update(camera, delta);      // renders the hidden scene into the render target
  renderer.render(scene, camera);  // then draws the card with the hologram material
  requestAnimationFrame(frameLoop);
}
frameLoop();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

addEventListener('beforeunload', () => {
  holo.dispose();
  if (customURL) URL.revokeObjectURL(customURL);
  renderer.dispose();
});
</script>
